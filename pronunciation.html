<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0f4f8">
<title>學生口說發音評分系統</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--primary:#3498db;--success:#2ecc71;--warning:#f1c40f;--danger:#e74c3c;--purple:#8e44ad;--orange:#e67e22;--teal:#1abc9c;--dark:#1e293b;--light-bg:#f8fafc;--border:#cbd5e1}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f0f4f8;color:var(--dark);margin:0;padding:24px 12px;display:flex;flex-direction:column;align-items:center}
.inapp-warning{display:none;background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:12px;border-radius:8px;margin-bottom:15px;width:100%;max-width:700px;font-size:14px;line-height:1.5;text-align:center}
.instructor-card{background:#fff;padding:28px 24px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,.08);width:100%;max-width:700px}
.header-container{display:flex;justify-content:center;align-items:center;position:relative;margin-bottom:20px;min-height:36px}
h1{text-align:center;color:var(--dark);font-size:24px;margin:0;font-weight:700}
.btn-teacher-lock{position:absolute;right:0;background:transparent;border:1px solid #cbd5e1;color:#64748b;padding:5px 10px;font-size:12px;border-radius:20px;cursor:pointer}
.teacher-panel{display:none;background:#eef6fb;border:1px solid #bee3f8;border-radius:12px;padding:15px;margin-bottom:20px}
.panel-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:10px}
.teacher-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-file-label{background:var(--teal);color:white;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block}
.btn-random{background:var(--orange);color:white;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.bank-status{font-size:12px;color:#64748b;margin-top:8px}
.student-info-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--light-bg);padding:15px;border-radius:12px;border:1px solid var(--border);margin-bottom:20px;width:100%}
.form-group{display:flex;flex-direction:column;text-align:left;min-width:0}
.form-group label{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap}
.form-group label::after{content:" *";color:var(--danger)}
.form-group input{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--border);border-radius:6px;outline:none;min-width:0}
.form-group input:focus{border-color:var(--primary)}
.sentence-box{font-size:26px;font-weight:600;line-height:1.8;padding:24px 28px;background:#fff;border-radius:16px;border:2px solid #cbd5e1;margin-bottom:20px;text-align:left;overflow-wrap:anywhere;letter-spacing:.01em;box-shadow:inset 0 2px 4px rgba(0,0,0,.02);min-height:100px}
.w-unit{display:inline-block;margin:2px 1px;padding:2px 8px;border-radius:6px;font-weight:600;transition:all .2s}
.w-unit.pending{color:#334155;background:transparent;padding:2px 0;margin:0}
.w-unit.correct{color:white;background:var(--success)}
.w-unit.wrong{color:white;background:var(--danger)}
.w-unit.missing{color:#3d3510;background:var(--warning)}
.legend{display:flex;justify-content:center;gap:12px;margin-bottom:20px;font-size:13px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px}
.control-panel{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
button{padding:10px 18px;font-size:14px;font-weight:600;border:0;border-radius:8px;cursor:pointer;transition:transform .1s,opacity .2s;min-height:42px}
button:active{transform:scale(.98)}.btn-audio{background:#e2e8f0;color:var(--dark)}.btn-mic{background:var(--primary);color:white}.btn-next{background:var(--purple);color:white}
.btn-mic.recording{background:var(--danger);animation:pulse 1s infinite alternate}
button:disabled{background:#cbd5e1;color:#94a3b8;cursor:not-allowed}
.score-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--light-bg);padding:15px;border-radius:12px;border:1px solid #e2e8f0;text-align:center}
.score-card{padding:5px}.score-num{font-size:26px;font-weight:800;margin-top:4px}.score-num.count{color:var(--purple)}.score-num.complete{color:var(--success)}.score-num.total{color:var(--primary)}
.feedback-msg{grid-column:span 3;margin-top:8px;font-weight:600;color:#475569;border-top:1px dashed #cbd5e1;padding-top:12px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}
@keyframes pulse{from{opacity:1}to{opacity:.7}}
@media(max-width:560px){body{padding:12px 8px}.instructor-card{padding:20px 14px;border-radius:15px}.header-container{padding-top:34px}h1{font-size:21px}.btn-teacher-lock{top:0;right:0}.sentence-box{font-size:22px;padding:18px 16px}.student-info-form{grid-template-columns:1fr}.score-board{grid-template-columns:1fr}.feedback-msg{grid-column:span 1}.control-panel button{flex:1 1 100%}}
</style>
</head>
<body>
<div class="inapp-warning" id="inAppWarning">⚠️ 偵測到您正在使用 App 內建瀏覽器。請點擊右上角「⋮」或「分享」，選擇「在 Chrome / Safari 中開啟」以存取麥克風。</div>
<div class="instructor-card">
 <div class="header-container">
  <h1>學生口說發音評分系統</h1>
  <button class="btn-teacher-lock" id="btnTeacherLock">🔒 教師解鎖</button>
 </div>
 <div class="teacher-panel" id="teacherPanel">
  <div class="panel-title">📚 題庫切換與自訂（教師功能）</div>
  <div class="teacher-actions">
   <button class="btn-random" id="btnRandom5">🎲 隨機載入 5 句日常英語</button>
   <label class="btn-file-label" for="fileInput">📁 上傳 text.txt 自訂題庫</label>
   <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
  </div>
  <div class="bank-status" id="bankStatus">目前題庫：預設格言題庫（共 6 條）</div>
 </div>
 <div class="student-info-form">
  <div class="form-group"><label for="studentClass">班級</label><input id="studentClass" placeholder="例如：英A1" autocomplete="off" required></div>
  <div class="form-group"><label for="studentId">學號</label><input id="studentId" placeholder="例如：1090123" autocomplete="off" required></div>
  <div class="form-group"><label for="studentName">姓名</label><input id="studentName" placeholder="例如：王小明" autocomplete="off" required></div>
 </div>
 <div class="legend">
  <div class="legend-item"><span class="dot" style="background:#7f8c8d"></span>未練習</div>
  <div class="legend-item"><span class="dot" style="background:var(--success)"></span>發音正確</div>
  <div class="legend-item"><span class="dot" style="background:var(--danger)"></span>發音錯誤</div>
  <div class="legend-item"><span class="dot" style="background:var(--warning)"></span>漏唸單字</div>
 </div>
 <div class="sentence-box" id="sentenceBox" aria-live="polite"></div>
 <div class="control-panel">
  <button class="btn-audio" id="btnAudio">🔊 聽示範（美音）</button>
  <button class="btn-mic" id="btnMic" disabled>🎙️ 開始錄音演練</button>
  <button class="btn-next" id="btnNext">🔄 換下一題</button>
 </div>
 <div class="score-board">
  <div class="score-card"><div>已嘗試次數</div><div class="score-num count" id="attemptCountDisplay">0 次</div></div>
  <div class="score-card"><div>句子完整度</div><div class="score-num complete" id="completionScore">0%</div></div>
  <div class="score-card"><div>發音精準度</div><div class="score-num total" id="accuracyScore">0%</div></div>
  <div class="feedback-msg" id="feedbackMsg">請填寫上方學生資訊，再開始練習。</div>
 </div>
</div>
<script>
// 請填入你自己的 GAS Web App URL；下方預設沿用實作指南中的端點。
const GAS_URL = "https://script.google.com/macros/s/AKfycbwGKabME3C398ARfyvxRpsLDyJ9jZgcnYAApWy1yN9fU1K13sf1jM5nFNjqQUAfiwO2/exec";
const AUTHORIZED_TEACHER_EMAIL = "audreyshih32@gm.chihlee.edu.tw";
const dailyEnglishPool = [
 "How's it going with you today?","Could you give me a quick hand with this?",
 "Sorry, I didn't quite catch what you said.","Let's grab a cup of coffee sometime this week.",
 "Do you happen to know where the restroom is?","That sounds like a wonderful idea!",
 "I'll get back to you as soon as possible.","What do you feel like eating for dinner tonight?",
 "Take your time, there is no rush at all.","Thanks a lot for taking the time to help me."
];
const defaultBank = ["Practice makes perfect.","Where there is a will, there is a way.","The quick brown fox jumps over the lazy dog.","Action speaks louder than words.","Honesty is the best policy.","Better late than never."];
let sentenceBank=[...defaultBank],currentSentenceIndex=0,targetSentence=sentenceBank[0],targetWords=[],attemptCount=0;
const $=id=>document.getElementById(id);
const studentClass=$("studentClass"),studentId=$("studentId"),studentName=$("studentName"),sentenceBox=$("sentenceBox");
const btnAudio=$("btnAudio"),btnMic=$("btnMic"),btnNext=$("btnNext"),teacherPanel=$("teacherPanel"),feedbackMsg=$("feedbackMsg");
const ua=navigator.userAgent||navigator.vendor||"";
if(/Line|FBAN|FBAV|Instagram|Teams/i.test(ua))$("inAppWarning").style.display="block";
function checkFormValidity(){
 const valid=!!(studentClass.value.trim()&&studentId.value.trim()&&studentName.value.trim());
 btnMic.disabled=!valid;
 if(!valid)feedbackMsg.textContent="請填寫上方學生資訊，再開始練習。";
 else if(feedbackMsg.textContent.includes("請填寫上方學生資訊"))feedbackMsg.textContent="基本資料已填寫，點擊按鈕開始錄音。";
 return valid;
}
[studentClass,studentId,studentName].forEach(x=>x.addEventListener("input",checkFormValidity));
function initSentence(text){
 targetSentence=text;targetWords=text.toLowerCase().match(/\b[\w'-]+\b/g)||[];
 const chunks=text.split(/(\s+)/);let i=0;
 sentenceBox.innerHTML=chunks.map(chunk=>{
  if(/\b[\w'-]+\b/.test(chunk)){const safe=chunk.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const word=chunk.toLowerCase().replace(/[^\w'-]/g,"");return `<span class="w-unit pending" id="w-${i++}" data-word="${word}">${safe}</span>`;}
  return chunk.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 }).join("");
}
function resetScoresAndLoadFirst(){
 currentSentenceIndex=0;attemptCount=0;initSentence(sentenceBank[0]);
 $("completionScore").textContent="0%";$("accuracyScore").textContent="0%";$("attemptCountDisplay").textContent="0 次";
 if(checkFormValidity())feedbackMsg.textContent=`已成功載入新題庫（共 ${sentenceBank.length} 題），請點擊錄音開始練習。`;
}
function clearWordColors(){targetWords.forEach((_,i)=>{const el=$(`w-${i}`);if(el)el.className="w-unit pending";});}
function setCurrentSentence(index){
 currentSentenceIndex=index;attemptCount=0;initSentence(sentenceBank[index]);
 $("completionScore").textContent="0%";$("accuracyScore").textContent="0%";$("attemptCountDisplay").textContent="0 次";
 if(checkFormValidity())feedbackMsg.textContent=`已切換至第 ${index+1} / ${sentenceBank.length} 題，點擊錄音按鈕開始練習。`;
}
$("btnNext").addEventListener("click",()=>setCurrentSentence((currentSentenceIndex+1)%sentenceBank.length));
$("btnRandom5").addEventListener("click",()=>{
 const shuffled=[...dailyEnglishPool].sort(()=>Math.random()-.5);sentenceBank=shuffled.slice(0,5);
 $("bankStatus").textContent="目前題庫：隨機日常生活英語（共 5 條）";resetScoresAndLoadFirst();
});
$("fileInput").addEventListener("change",e=>{
 const file=e.target.files[0];if(!file)return;const reader=new FileReader();
 reader.onload=ev=>{const lines=String(ev.target.result).split(/\r?\n/).map(x=>x.trim().replace(/^"|"$/g,"")).filter(Boolean);
  if(lines.length){sentenceBank=lines;$("bankStatus").textContent=`目前題庫：自訂檔案 ${file.name}（共 ${lines.length} 條）`;resetScoresAndLoadFirst();}
  else alert("上傳的文字檔內沒有有效英文句子！");
 };reader.readAsText(file,"UTF-8");e.target.value="";
});
$("btnTeacherLock").addEventListener("click",()=>{
 if(teacherPanel.style.display==="block"){
  if(confirm("是否要鎖定並隱藏教師功能區？")){teacherPanel.style.display="none";$("btnTeacherLock").textContent="🔒 教師解鎖";localStorage.removeItem("teacherUnlocked");}return;
 }
 const email=prompt("請輸入授權教師 Email 以解鎖自訂題庫功能：");
 if(email&&email.trim().toLowerCase()===AUTHORIZED_TEACHER_EMAIL.toLowerCase()){
  alert("驗證成功！已解鎖教師功能區。");teacherPanel.style.display="block";$("btnTeacherLock").textContent="🔓 教師已解鎖";localStorage.setItem("teacherUnlocked","true");
 }else if(email!==null)alert("Email 驗證失敗，無權限存取教師功能！");
});
if(localStorage.getItem("teacherUnlocked")==="true"){teacherPanel.style.display="block";$("btnTeacherLock").textContent="🔓 教師已解鎖";}
btnAudio.addEventListener("click",()=>{
 if(!("speechSynthesis"in window)){alert("此瀏覽器不支援語音合成。");return;}
 const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(targetSentence);u.lang="en-US";u.rate=.85;
 const voices=synth.getVoices();const us=voices.find(v=>/en-US|en_US/i.test(v.lang));if(us)u.voice=us;synth.speak(u);
});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){feedbackMsg.textContent="您的瀏覽器不支援語音辨識，請使用 Chrome 開啟。錄音辨識功能無法使用。";btnMic.disabled=true;}
else{
 const recognition=new SpeechRecognition();recognition.lang="en-US";recognition.interimResults=false;recognition.maxAlternatives=1;
 btnMic.addEventListener("click",()=>{if(!checkFormValidity())return;try{recognition.start();}catch(e){try{recognition.stop();}catch(_){} }});
 recognition.onstart=()=>{
  btnMic.classList.add("recording");btnMic.textContent="學生錄音中…";feedbackMsg.textContent=`正在聆聽 [${studentClass.value}] ${studentName.value} 同學的發音…`;clearWordColors();
 };
 recognition.onend=()=>{btnMic.classList.remove("recording");btnMic.textContent="🎙️ 開始錄音演練";};
 recognition.onresult=event=>{
  attemptCount++;$("attemptCountDisplay").textContent=`${attemptCount} 次`;
  const transcript=event.results[0][0].transcript;const studentWords=transcript.toLowerCase().match(/\b[\w'-]+\b/g)||[];
  let sIdx=0,correct=0,missing=0,wrong=0;
  for(let tIdx=0;tIdx<targetWords.length;tIdx++){
   const target=targetWords[tIdx],el=$(`w-${tIdx}`);
   if(sIdx<studentWords.length){
    if(studentWords[sIdx]===target){if(el)el.className="w-unit correct";correct++;sIdx++;}
    else{
     const nextMatch=studentWords.slice(sIdx).indexOf(target);
     if(nextMatch!==-1){if(el)el.className="w-unit missing";missing++;}
     else{if(el)el.className="w-unit wrong";wrong++;sIdx++;}
    }
   }else{if(el)el.className="w-unit missing";missing++;}
  }
  const attempted=correct+wrong;
  const completion=Math.round((attempted/Math.max(targetWords.length,1))*100);
  const accuracy=attempted>0?Math.round(correct/attempted*100):0;
  $("completionScore").textContent=completion+"%";$("accuracyScore").textContent=accuracy+"%";
  feedbackMsg.textContent=`辨識結果：「${transcript}」｜正確 ${correct} 個、錯誤 ${wrong} 個、漏唸 ${missing} 個。正在同步第 ${attemptCount} 次練習數據至雲端…`;
  sendDataToGoogleSheet(completion,accuracy,transcript,attemptCount,targetSentence);
 };
 recognition.onerror=event=>{feedbackMsg.textContent=`錯誤：${event.error}。請確認已允許麥克風權限，並以 HTTPS 網址開啟。`;};
}
function sendDataToGoogleSheet(completion,accuracy,transcript,currentAttempt,targetSentenceText){
 const payload={className:studentClass.value.trim(),studentId:studentId.value.trim(),studentName:studentName.value.trim(),attemptCount:currentAttempt,targetSentence:targetSentenceText,completion,accuracy,transcript};
 if(!GAS_URL||GAS_URL.includes("YOUR_DEPLOYMENT_ID")){feedbackMsg.textContent="本次辨識完成；尚未設定 GAS_URL，因此未同步雲端。";return;}
 fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
 .then(()=>{feedbackMsg.innerHTML=`<span style="color:var(--success)">第 ${currentAttempt} 次練習資料已送出。</span><br>${studentName.value} 同學辨識文字：「${escapeHTML(transcript)}」`;})
 .catch(()=>{feedbackMsg.innerHTML='<span style="color:var(--danger)">雲端同步失敗，請檢查網路或 GAS 部署設定。</span>';});
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
initSentence(targetSentence);checkFormValidity();
</script>
</body>
</html>
